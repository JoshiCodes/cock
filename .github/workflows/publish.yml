# Publishes the package to GitHub Packages.
#
# GitHub Packages only accepts a scope that matches the repository owner, so
# the scope here and in package.json is @joshicodes (npm scopes are lowercase).
#
# Cutting a GitHub release publishes the version named by its tag.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.2.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@joshicodes'

      - run: bun install --frozen-lockfile

      - name: Types
        run: bun run check

      - name: Set version
        run: |
          raw="${{ github.event.release.tag_name || inputs.version }}"
          npm version "${raw#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
