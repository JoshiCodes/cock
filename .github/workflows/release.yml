# Bump "version" in package.json, push to master, done.
#
# When the version is newer than the latest v* tag, this publishes the package to
# npm, then creates the tag and a GitHub release with generated notes. Versions
# with a suffix (1.2.0-beta.1) are published under the "next" tag and marked as a
# pre-release. Anything else that touches package.json is checked and skipped.
#
# Needs an NPM_TOKEN secret: an npm automation token with publish rights.

name: Release

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  # Lets npm attach a provenance statement, so the tarball can be traced to this run.
  id-token: write

# Two quick pushes must not race each other to the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to compare against the last release.
          fetch-depth: 0

      - name: Compare with the last release
        id: version
        run: .github/scripts/should-release.sh

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.release == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.version.outputs.release == 'true'
        run: bun install --frozen-lockfile

      - name: Types
        if: steps.version.outputs.release == 'true'
        run: bun run check

      # npm runs the prepack script, which builds dist/ and runs publint.
      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        run: npm publish ${{ steps.version.outputs.prerelease == 'true' && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and release
        if: steps.version.outputs.release == 'true'
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          --target "$GITHUB_SHA"
          --title "${{ steps.version.outputs.tag }}"
          --generate-notes
          ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
