<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<!--
			Reading this with a language model? The documentation is plain text too:
			/llms.txt is the map, /llms-full.txt is every component, prop and default
			in one file. Both are generated from the same sources as these pages.
		-->
		<link
			rel="alternate"
			type="text/plain"
			href="%sveltekit.assets%/llms.txt"
			title="Docs for language models"
		/>
		<link
			rel="alternate"
			type="text/plain"
			href="%sveltekit.assets%/llms-full.txt"
			title="Full API for language models"
		/>
		<meta name="theme-color" content="#faf9fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
