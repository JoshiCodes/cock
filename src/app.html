<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#faf9fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					const d = document.documentElement;
					const m = localStorage.getItem('ck-theme') || 'system';
					const dark =
						m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
					d.classList.toggle('dark', dark);
					const a = localStorage.getItem('ck-accent');
					if (a) d.dataset.accent = a;
					const t =
						JSON.parse(localStorage.getItem('ck-tokens') || '{}')[dark ? 'dark' : 'light'] || {};
					for (const n in t) d.style.setProperty(n, t[n]);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
